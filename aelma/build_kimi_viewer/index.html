<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>AELMA Viewer — F/V EILEEN</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene-container"></div>

  <!-- Alerts Panel -->
  <div id="alerts-panel" class="alerts-panel">
    <div class="alerts-header">
      <h2>ALERTS</h2>
      <button id="clear-all-alerts" class="btn-clear-all" title="Clear all alerts">✕ Clear All</button>
    </div>
    <div id="alerts-list" class="alerts-list"></div>
    <div id="alerts-history" class="alerts-history">
      <h3>History</h3>
      <div id="alerts-history-list" class="alerts-history-list"></div>
    </div>
  </div>

  <!-- Quick Actions Panel -->
  <div id="quick-actions" class="quick-actions">
    <button class="action-btn" data-action="haul_gear" title="Haul Gear">▲ Haul Gear</button>
    <button class="action-btn" data-action="anchor_drop" title="Drop Anchor">⚓ Drop Anchor</button>
    <button class="action-btn" data-action="clear_alerts" title="Clear Alerts">✕ Clear Alerts</button>
  </div>

  <!-- Action Confirmation Dialog -->
  <div id="action-dialog" class="action-dialog hidden">
    <div class="dialog-content">
      <h3 id="dialog-title">Confirm Action</h3>
      <p id="dialog-message">Are you sure?</p>
      <div id="dialog-payload" class="dialog-payload"></div>
      <div class="dialog-buttons">
        <button id="dialog-confirm" class="btn-confirm">Confirm</button>
        <button id="dialog-cancel" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <header class="panel">
      <div class="title-row">
        <span id="status-dot" class="dot dot-disconnected" title="connection status"></span>
        <h1 id="vessel-id">AELMA VIEWER</h1>
      </div>
      <div id="conn-status" class="subtitle">connecting…</div>
    </header>

    <section class="panel depth-panel">
      <div class="label">DEPTH</div>
      <div id="depth-big" class="depth-big q-none">—</div>
      <div class="label" id="depth-quality">no data</div>
    </section>

    <section class="panel">
      <div class="label">CHANNELS</div>
      <div id="channel-grid" class="channel-grid"></div>
    </section>

    <section class="panel stats-panel">
      <div class="stat-row"><span>Bathymetry voxels</span><span id="voxel-count" class="stat-val">0</span></div>
      <div class="stat-row"><span>Session</span><span id="session-time" class="stat-val">00:00</span></div>
      <div class="stat-row"><span>Position</span><span id="position" class="stat-val">—</span></div>
    </section>
  </aside>

  <script type="module">
    import './app.js';
  </script>
</body>
</html>
